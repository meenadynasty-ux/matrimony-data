name: Daily Firebase Auto-Sync

on:
  schedule:
    # यह टाइमर रोज़ रात 12:00 बजे (भारतीय समयानुसार) चलेगा
    - cron: '30 18 * * *'
  workflow_dispatch: # यह आपको जब चाहें तब मैन्युअली चलाने का बटन भी देगा

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Data Cleaning Script
        run: node sync.js

      - name: Commit and Push New Data
        run: |
          git config --global user.name "Auto-Sync-Bot"
          git config --global user.email "bot@meenamatrimony.com"
          git add public_profiles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Firebase से ताज़ा डेटा सिंक किया गया" && git push)
